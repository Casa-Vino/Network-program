name: Build Windows app

# Builds the Flutter scanner as a Windows desktop app and publishes a zip to
# the rolling release. Runs on a Windows runner (desktop builds need the
# platform's native toolchain, which GitHub provides).

on:
  push:
    branches: [main, send-files-feature]
    paths:
      - "mobile/device_scanner/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Newer Flutter so the Windows toolchain targets VS 2022 (the runner's
      # version); 3.24 defaulted to the VS 2019 generator and failed.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.29.0"

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Toolchain diagnostics
        run: flutter doctor -v

      - name: Preserve app sources
        working-directory: mobile/device_scanner
        run: |
          mkdir -p /tmp/appsrc
          cp pubspec.yaml /tmp/appsrc/pubspec.yaml
          cp -r lib /tmp/appsrc/lib

      - name: Generate Windows scaffold
        working-directory: mobile/device_scanner
        run: flutter create --platforms=windows --org com.casavino --project-name device_scanner .

      - name: Restore app sources
        working-directory: mobile/device_scanner
        run: |
          cp /tmp/appsrc/pubspec.yaml pubspec.yaml
          rm -rf lib
          cp -r /tmp/appsrc/lib lib

      - name: Install dependencies
        working-directory: mobile/device_scanner
        run: flutter pub get

      - name: Build Windows (release)
        working-directory: mobile/device_scanner
        run: |
          set -o pipefail
          flutter build windows --release 2>&1 | tee "$RUNNER_TEMP/winbuild.log"

      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Windows build failed'
            echo
            echo '```'
            tail -n 150 "$RUNNER_TEMP/winbuild.log" 2>/dev/null || echo "(no log)"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@"$RUNNER_TEMP/body.md" || true

      - name: Zip the build
        working-directory: mobile/device_scanner/build/windows/x64/runner/Release
        run: 7z a "$GITHUB_WORKSPACE/device-scanner-windows-x64.zip" ./*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: device-scanner-windows-x64
          path: device-scanner-windows-x64.zip
          if-no-files-found: error

      - name: Publish to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          files: device-scanner-windows-x64.zip
