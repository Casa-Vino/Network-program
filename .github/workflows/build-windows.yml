name: Build Windows app

# Builds the Flutter scanner as a Windows desktop app and publishes a zip to
# the rolling release. Runs on a Windows runner (desktop builds need the
# platform's native toolchain, which GitHub provides).

on:
  push:
    branches: [main, send-files-feature]
    paths:
      - "mobile/device_scanner/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    # Pin to windows-2022 (Visual Studio 2022): windows-latest now ships VS
    # 2026 (major v18), which Flutter doesn't recognize, so it falls back to
    # the VS 2019 generator and fails.
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.0"

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Toolchain diagnostics
        run: |
          flutter --version 2>&1 | tee "$RUNNER_TEMP/doctor.log"
          flutter doctor -v 2>&1 | tee -a "$RUNNER_TEMP/doctor.log"

      - name: Preserve app sources
        working-directory: mobile/device_scanner
        run: |
          mkdir -p /tmp/appsrc
          cp pubspec.yaml /tmp/appsrc/pubspec.yaml
          cp -r lib /tmp/appsrc/lib

      - name: Generate Windows scaffold
        working-directory: mobile/device_scanner
        run: flutter create --platforms=windows --org com.casavino --project-name device_scanner .

      - name: Restore app sources
        working-directory: mobile/device_scanner
        run: |
          cp /tmp/appsrc/pubspec.yaml pubspec.yaml
          rm -rf lib
          cp -r /tmp/appsrc/lib lib

      - name: Install dependencies
        working-directory: mobile/device_scanner
        run: flutter pub get

      - name: Build Windows (release)
        working-directory: mobile/device_scanner
        run: |
          set -o pipefail
          flutter build windows --release --verbose 2>&1 | tee "$RUNNER_TEMP/winbuild.log"

      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Windows build failed'
            echo '### flutter version / doctor'
            echo '```'
            tail -n 70 "$RUNNER_TEMP/doctor.log" 2>/dev/null || echo "(no doctor log)"
            echo '```'
            echo '### build log (relevant tail)'
            echo '```'
            grep -iE "visual studio|cmake|generator|vswhere|-G |msbuild|build windows" "$RUNNER_TEMP/winbuild.log" 2>/dev/null | tail -n 60 || true
            echo '...'
            tail -n 60 "$RUNNER_TEMP/winbuild.log" 2>/dev/null || echo "(no log)"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@"$RUNNER_TEMP/body.md" || true

      # Bundle the VC++ runtime DLLs so the app runs on a clean Windows without
      # the user installing the Visual C++ Redistributable.
      - name: Bundle VC++ runtime
        run: |
          REL="$GITHUB_WORKSPACE/mobile/device_scanner/build/windows/x64/runner/Release"
          found=""
          for base in "/c/Program Files/Microsoft Visual Studio/2022"/*/VC/Redist/MSVC; do
            [ -d "$base" ] || continue
            crt=$(find "$base" -type d -ipath "*x64*Microsoft.VC14*.CRT" | sort | tail -1)
            [ -n "$crt" ] && found="$crt" && break
          done
          echo "CRT dir: $found"
          if [ -n "$found" ]; then
            cp "$found"/vcruntime140*.dll "$REL"/ 2>/dev/null || true
            cp "$found"/msvcp140*.dll "$REL"/ 2>/dev/null || true
          else
            echo "WARNING: VC++ runtime not found to bundle" >&2
          fi
          ls "$REL"

      - name: Zip the build
        working-directory: mobile/device_scanner/build/windows/x64/runner/Release
        run: 7z a "$GITHUB_WORKSPACE/device-scanner-windows-x64.zip" ./*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: device-scanner-windows-x64
          path: device-scanner-windows-x64.zip
          if-no-files-found: error

      - name: Publish to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          files: device-scanner-windows-x64.zip
